server.port=4000
spring.application.name=sharespace-api

# Database (PostgreSQL via RDS)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/sharespace}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# AWS Configuration
aws.region=${AWS_REGION:eu-west-2}
aws.s3.bucket=${S3_BUCKET:sharespace-images}
aws.cognito.userPoolId=${COGNITO_USER_POOL_ID:}
aws.cognito.region=${AWS_REGION:eu-west-2}

# CORS
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
